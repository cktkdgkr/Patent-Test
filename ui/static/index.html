<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Patent Screening Console</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <h1>Patent Screening Console</h1>
          <p>enzyme design-around screening</p>
        </div>
        <div class="status-strip" id="statusStrip">
          <span class="dot idle"></span>
          <span id="statusText">대기 중</span>
        </div>
      </header>

      <main class="workspace">
        <section class="input-pane" aria-label="screening input">
          <div class="section-head">
            <h2>제품 정보</h2>
          </div>

          <form id="screenForm">
            <div class="field-grid">
              <label>
                <span>Product ID</span>
                <input name="product_id" value="enzyme_product_alpha" required />
              </label>
              <label>
                <span>Enzyme name</span>
                <input name="enzyme_name" value="Alpha protease blend" />
              </label>
              <label>
                <span>Identity %</span>
                <input name="identity" type="number" step="0.1" min="0" max="100" value="80" />
              </label>
              <label>
                <span>pH</span>
                <input name="ph" type="number" step="0.1" min="0" max="14" value="7" />
              </label>
              <label>
                <span>Temp °C</span>
                <input name="temperature_c" type="number" step="0.1" value="45" />
              </label>
              <label>
                <span>Enzyme class</span>
                <input name="enzyme_class" value="protease" />
              </label>
              <label>
                <span>Substrate</span>
                <input name="substrate" value="protein substrate" />
              </label>
              <label>
                <span>Variant</span>
                <input name="variant" value="A123V" />
              </label>
              <label>
                <span>Jurisdiction</span>
                <input name="jurisdiction" value="US" />
              </label>
              <label>
                <span>Launch date</span>
                <input name="launch_date" type="date" value="2026-09-01" />
              </label>
            </div>

            <div class="upload-row">
              <label class="file-box">
                <span>Patent CSV/XLSX</span>
                <input id="candidateFile" name="candidate_file" type="file" accept=".csv,.xlsx" />
              </label>
              <label class="switch">
                <input id="enableWebFetch" type="checkbox" checked />
                <span>웹 조회</span>
              </label>
            </div>

            <div class="actions">
              <button type="submit" class="primary">분석 실행</button>
              <button type="button" id="runExample">웹 예시 실행</button>
              <button type="reset" id="resetForm">리셋</button>
            </div>
          </form>
        </section>

        <section class="result-pane" aria-label="screening output">
          <div class="section-head">
            <h2>결과</h2>
            <button type="button" id="downloadJson" disabled>JSON</button>
          </div>

          <div class="metric-row" id="metricRow">
            <div><span>Total</span><strong>0</strong></div>
            <div><span>Screened</span><strong>0</strong></div>
            <div><span>Failed</span><strong>0</strong></div>
            <div><span>High</span><strong>0</strong></div>
            <div><span>Medium</span><strong>0</strong></div>
            <div><span>Low</span><strong>0</strong></div>
            <div><span>Safe</span><strong>0</strong></div>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Grade</th>
                  <th>Patent</th>
                  <th>Claims</th>
                  <th>Options</th>
                  <th>Confidence</th>
                  <th>Reasoning</th>
                </tr>
              </thead>
              <tbody id="resultRows">
                <tr class="empty-row">
                  <td colspan="6">결과 없음</td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="detail-pane" id="detailPane">
            <div class="detail-empty">특허 행을 선택하면 claim과 회피 후보가 표시됩니다.</div>
          </div>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
