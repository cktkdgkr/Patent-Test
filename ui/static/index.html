<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Patent Screening Console</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <h1>Patent Screening Console</h1>
          <p>enzyme design-around screening</p>
        </div>
        <div class="status-strip" id="statusStrip">
          <span class="dot idle"></span>
          <span id="statusText">대기 중</span>
        </div>
      </header>

      <main class="workspace">
        <section class="input-pane" aria-label="screening input">
          <div class="section-head">
            <h2>제품 정보</h2>
          </div>

          <form id="screenForm">
            <div class="field-grid">
              <label>
                <span>User ID</span>
                <input id="userId" name="user_id" placeholder="본인 ID/이메일" autocomplete="username" />
              </label>
              <label>
                <span>Product ID</span>
                <input name="product_id" value="enzyme_product_alpha" required />
              </label>
              <label>
                <span>Enzyme name</span>
                <input name="enzyme_name" value="Alpha protease blend" />
              </label>
              <label class="wide">
                <span>FASTA textarea</span>
                <textarea name="fasta_text" rows="4" spellcheck="false"></textarea>
              </label>
              <label>
                <span>FASTA file</span>
                <input id="fastaFile" name="fasta_file" type="file" accept=".fa,.faa,.fasta,.txt" />
              </label>
              <label>
                <span>Reference SEQ ID</span>
                <input name="reference_sequence_id" value="SEQ ID NO:1" />
              </label>
              <label>
                <span>Alignment backend</span>
                <select name="alignment_backend">
                  <option value="auto" selected>Auto</option>
                  <option value="needleman_wunsch">Needleman-Wunsch</option>
                  <option value="blastp">BLASTP</option>
                  <option value="mmseqs">MMseqs2</option>
                </select>
              </label>
              <label class="wide">
                <span>Amino acid sequence</span>
                <textarea name="amino_acid_sequence" rows="3" spellcheck="false">MKTAYIAKQRQISFVKSHFSRQEILDLIC</textarea>
              </label>
              <label>
                <span>Identity % override</span>
                <input name="identity" type="number" step="0.1" min="0" max="100" />
              </label>
              <label>
                <span>pH</span>
                <input name="ph" type="number" step="0.1" min="0" max="14" value="7" />
              </label>
              <label>
                <span>Temp °C</span>
                <input name="temperature_c" type="number" step="0.1" value="45" />
              </label>
              <label>
                <span>Enzyme class</span>
                <input name="enzyme_class" value="protease" />
              </label>
              <label>
                <span>Substrate</span>
                <input name="substrate" value="protein substrate" />
              </label>
              <label>
                <span>Variant</span>
                <input name="variant" value="A10V" />
              </label>
              <label>
                <span>Activity</span>
                <input name="activity" value="protease activity" />
              </label>
              <label>
                <span>Organism</span>
                <input name="organism" value="Bacillus sp." />
              </label>
              <label class="wide">
                <span>Use case</span>
                <input name="use_case" value="detergent enzyme formulation" />
              </label>
              <label>
                <span>Jurisdiction</span>
                <input name="jurisdiction" value="US" />
              </label>
              <label>
                <span>Launch date</span>
                <input name="launch_date" type="date" value="2026-09-01" />
              </label>
            </div>

            <div class="upload-row">
              <label class="file-box">
                <span>Patent CSV/XLSX</span>
                <input id="candidateFile" name="candidate_file" type="file" accept=".csv,.xlsx" />
              </label>
              <label class="switch">
                <input id="enableWebFetch" type="checkbox" checked />
                <span>웹 조회</span>
              </label>
            </div>

            <div class="actions">
              <button type="submit" class="primary">분석 실행</button>
              <button type="button" id="runExample">서열 예시 실행</button>
              <button type="reset" id="resetForm">리셋</button>
            </div>
          </form>
        </section>

        <section class="result-pane" aria-label="screening output">
          <div class="section-head">
            <h2>결과</h2>
            <div class="tabs" role="tablist">
              <button type="button" class="tab active" data-tab="current" role="tab" aria-selected="true">현재 결과</button>
              <button type="button" class="tab" data-tab="history" role="tab" aria-selected="false">히스토리</button>
            </div>
            <button type="button" id="downloadJson" disabled>JSON</button>
          </div>

          <div class="tab-panel" data-panel="current">
            <div class="metric-row" id="metricRow">
              <div><span>Total</span><strong>0</strong></div>
              <div><span>Screened</span><strong>0</strong></div>
              <div><span>Failed</span><strong>0</strong></div>
              <div><span>High</span><strong>0</strong></div>
              <div><span>Medium</span><strong>0</strong></div>
              <div><span>Low</span><strong>0</strong></div>
              <div><span>Safe</span><strong>0</strong></div>
            </div>

            <div class="loaded-banner hidden" id="loadedBanner"></div>

            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Grade</th>
                    <th>Patent</th>
                    <th>Claims</th>
                    <th>Options</th>
                    <th>Confidence</th>
                    <th>Reasoning</th>
                  </tr>
                </thead>
                <tbody id="resultRows">
                  <tr class="empty-row">
                    <td colspan="6">결과 없음</td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div class="detail-pane" id="detailPane">
              <div class="detail-empty">특허 행을 선택하면 claim과 회피 후보가 표시됩니다.</div>
            </div>
          </div>

          <div class="tab-panel hidden" data-panel="history">
            <div class="history-filters">
              <label>
                <span>User ID</span>
                <input id="filterUserId" placeholder="본인만 보기" />
              </label>
              <label>
                <span>Product ID</span>
                <input id="filterProductId" placeholder="부분 일치" />
              </label>
              <label>
                <span>최고 등급</span>
                <select id="filterGrade">
                  <option value="">전체</option>
                  <option value="HIGH">HIGH</option>
                  <option value="MEDIUM">MEDIUM</option>
                  <option value="LOW">LOW</option>
                  <option value="SAFE">SAFE</option>
                </select>
              </label>
              <label>
                <span>From</span>
                <input id="filterFromDate" type="date" />
              </label>
              <label>
                <span>To</span>
                <input id="filterToDate" type="date" />
              </label>
              <div class="filter-actions">
                <button type="button" id="applyFilter" class="primary">검색</button>
                <button type="button" id="clearFilter">초기화</button>
                <button type="button" id="refreshHistory">새로고침</button>
              </div>
            </div>

            <div class="history-summary" id="historySummary">목록을 불러오는 중...</div>

            <div class="table-wrap">
              <table class="history-table">
                <thead>
                  <tr>
                    <th>일시</th>
                    <th>User</th>
                    <th>Product ID</th>
                    <th>Patents</th>
                    <th>Top Grade</th>
                    <th>Run ID</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="historyRows">
                  <tr class="empty-row"><td colspan="7">불러오는 중...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
